name: Release integrity

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify product and release integrity
        run: |
          npm test
          npm run test:028a
          npm run test:028b
          npm run test:028c
          npm run test:029l
