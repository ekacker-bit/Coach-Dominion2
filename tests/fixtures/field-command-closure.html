<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Command closure verification</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, Arial, sans-serif; background: #090b0a; color: #f2f0e8; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: radial-gradient(circle at 20% 0%, #1a2e20, #090b0a 55%); }
    main { width: min(1100px, calc(100% - 40px)); margin: 0 auto; padding: clamp(32px, 7vw, 80px) 0; }
    .kicker { color: #d4af37; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; }
    h1 { margin: .25em 0; font-size: clamp(42px, 7vw, 78px); line-height: .94; }
    .lead { max-width: 680px; color: #bac3bd; font-size: 19px; line-height: 1.5; }
    .routes { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin: 34px 0; }
    .route, .proof { border: 1px solid #3f5f4b; border-radius: 14px; background: #111714; padding: 20px; }
    .route small { color: #d4af37; font-weight: 800; letter-spacing: .12em; }
    .route strong { display: block; margin-top: 10px; font-size: 20px; overflow-wrap: anywhere; }
    .proof { border-color: #806a24; background: #15150f; }
    .proof strong { font-size: 24px; }
    .actions { display: flex; gap: 12px; margin-top: 24px; }
    button { min-height: 48px; border: 1px solid #d4af37; border-radius: 8px; padding: 0 18px; background: #d4af37; color: #090b0a; font: inherit; font-weight: 900; cursor: pointer; }
    button.secondary { background: transparent; color: #d4af37; }
    @media (max-width: 680px) {
      main { width: min(100% - 28px, 520px); padding: 30px 0 90px; }
      .routes { grid-template-columns: 1fr; margin: 26px 0; }
      .route { padding: 16px; }
      .actions { position: sticky; bottom: 12px; flex-direction: column; }
      button { width: 100%; }
    }
  </style>
</head>
<body>
  <main>
    <p class="kicker">Command closure</p>
    <h1 id="current-command">Loading…</h1>
    <p class="lead" id="explanation">Checking the signed assignments and account receipts.</p>
    <section class="routes" id="routes" aria-label="Cross-route command state"></section>
    <article class="proof">
      <strong id="status">Checking…</strong>
      <p id="persistence"></p>
      <p id="progress"></p>
    </article>
    <div class="actions">
      <button id="complete-current" type="button">Complete current assignment</button>
      <button id="reset" class="secondary" type="button">Reset verification</button>
    </div>
  </main>
  <script src="../../assets/js/field-command-closure.js?v=030z"></script>
  <script>
    (() => {
      const date = "2026-08-29";
      const authority = { contractRevision: 21, weekId: "week-35", weekRevision: 8 };
      const ledger = {
        date,
        fingerprint: "execution-ledger:verification",
        consistency: { consistent: true, issues: [] },
        entries: [
          { assignmentId: "lower-a", module: "strength", state: "scheduled", assignment: { title: "Lower A" } },
          { assignmentId: "easy-run", module: "running", state: "scheduled", assignment: { title: "Easy run" } },
          { assignmentId: "core-control", module: "core", state: "scheduled", assignment: { title: "Core control" } },
          { assignmentId: "fuel-target", module: "nutrition", state: "scheduled", assignment: { title: "Fuel target" } }
        ]
      };
      const storageKey = "field-command-closure-verification";
      const load = () => JSON.parse(localStorage.getItem(storageKey) || "[]");
      const receipt = (entry) => ({
        type: "COMMAND_COMPLETION_CERTIFICATION",
        id: `receipt-${entry.assignmentId}`,
        operationalDate: date,
        status: "CERTIFIED",
        verificationStatus: "VERIFIED",
        accountConfirmedAt: `${date}T18:00:00Z`,
        authority,
        completion: { assignmentId: entry.assignmentId, module: entry.module, state: "COMPLETE" },
        closure: { outcome: "COMPLETED", sourceEvidenceConfirmed: true }
      });
      function render() {
        const result = DominionFieldCommandClosure.evaluate({ date, authority, ledger, receipts: load() });
        const expected = result.closeoutReady ? "CLOSEOUT" : result.next.assignmentId;
        const surfaces = { today: expected, calendar: expected, train: expected, fuel: expected };
        const audit = DominionFieldCommandClosure.surfaceAudit(result, surfaces);
        document.getElementById("current-command").textContent = result.closeoutReady ? "Daily Closeout" : `Next: ${result.next.title}`;
        document.getElementById("explanation").textContent = result.closeoutReady
          ? "Every signed assignment is terminal and confirmed to the account."
          : "The exact account receipt advances every route to one next assignment.";
        document.getElementById("routes").innerHTML = Object.entries(surfaces).map(([name, value]) => `<article class="route" data-route="${name}" data-assignment="${value}"><small>${name.toUpperCase()}</small><strong>${value}</strong></article>`).join("");
        document.getElementById("status").textContent = audit.matches ? "Routes aligned" : "Drift detected";
        document.getElementById("persistence").textContent = `Next-command fingerprint: ${result.nextFingerprint}`;
        document.getElementById("progress").textContent = `${result.terminal} of ${result.total} assignments account-confirmed.`;
        document.getElementById("complete-current").hidden = result.closeoutReady;
        document.body.dataset.fieldClosure = result.state;
        document.body.dataset.nextAssignment = expected;
      }
      document.getElementById("complete-current").addEventListener("click", () => {
        const result = DominionFieldCommandClosure.evaluate({ date, authority, ledger, receipts: load() });
        if (!result.next) return;
        const nextReceipt = receipt(ledger.entries.find((entry) => entry.assignmentId === result.next.assignmentId));
        localStorage.setItem(storageKey, JSON.stringify([...load().filter((item) => item.id !== nextReceipt.id), nextReceipt]));
        render();
      });
      document.getElementById("reset").addEventListener("click", () => { localStorage.removeItem(storageKey); render(); });
      render();
    })();
  </script>
</body>
</html>
