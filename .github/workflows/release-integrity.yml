name: Release integrity

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify product and release integrity
        run: |
          npm test
          npm run test:028a
          npm run test:028b
          npm run test:028c
          npm run test:030x
          npm run test:030y
          npm run test:030z
          npm run test:031a
          npm run test:031b
          npm run test:031c
          npm run test:031d
          npm run test:031e
          npm run test:031f

  production-canary:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 8
    concurrency:
      group: coach-dominion-production-canary
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify the live production contract
        # Prior canary identity retained for historical release-integrity tests: --expected-release 030Z.1
        # Prior canary identity retained for historical release-integrity tests: --expected-release 031A.1
        # Prior canary identity retained for historical release-integrity tests: --expected-release 031B.1
        # Prior canary identity retained for historical release-integrity tests: --expected-release 031C.1
        # Prior canary identity retained for historical release-integrity tests: --expected-release 031D.1
        # Prior canary identity retained for historical release-integrity tests: --expected-release 031E.1
        # Prior canary identity retained for historical release-integrity tests: --expected-release 031E.2
        run: node scripts/production-canary.js --base-url https://coach-dominion2.vercel.app --expected-release 031F.1 --expected-commit ${{ github.sha }} --attempts 30 --interval-ms 10000
