name: Release integrity

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify product and release integrity
        run: |
          npm test
          npm run test:028a
          npm run test:028b
          npm run test:028c
          npm run test:030o

  production-canary:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 8
    concurrency:
      group: coach-dominion-production-canary
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify the live production contract
        run: node scripts/production-canary.js --base-url https://coach-dominion2.vercel.app --expected-release 030O.1 --expected-commit ${{ github.sha }} --attempts 30 --interval-ms 10000
